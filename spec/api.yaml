openapi: 3.1.0
info:
  title: Flash Cashback API
  version: 0.1.0
  description: >
    Scaffold only. Cashback earning, redemption, and history endpoints will
    be added once spec/decisions.md and spec/invariants.md are finalized.
paths:
  /healthz:
    get:
      summary: Liveness check
      operationId: getHealthz
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]
  /readyz:
    get:
      summary: Readiness check
      operationId: getReadyz
      responses:
        "200":
          description: All dependencies are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyzResult"
        "503":
          description: One or more dependencies are unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyzResult"
components:
  schemas:
    ReadyzResult:
      type: object
      properties:
        postgres:
          type: string
          description: "\"ok\" or the error returned by the ping."
        redis:
          type: string
          description: "\"ok\" or the error returned by the ping."
      required: [postgres, redis]
